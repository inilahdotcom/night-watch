# Night Watch — production compose. Three services from one image:
#
#   migrate  runs once, applies pending SQL migrations to the shared DB
#   web      the TanStack Start dashboard on :3011
#   worker   the long-lived scheduler that owns every DB write
#
# Both `web` and `worker` mount the same named volume for the SQLite file
# so they share state; the WhatsApp Baileys auth folder lives on the same
# volume so `wa_relink` from the dashboard survives container restarts.
# Config is bind-mounted read-only so operators can edit `monitors.json`
# without rebuilding.

services:
  migrate:
    build: .
    image: night-watch:latest
    restart: "no"
    working_dir: /app/packages/core
    command: ["bun", "run", "src/db/migrate.ts"]
    environment:
      - DATABASE_URL=/data/night-watch.db
      - LOG_LEVEL=info
    volumes:
      - db-data:/data
      - ./config:/config:ro
    env_file:
      - path: .env
        required: false

  web:
    build: .
    image: night-watch:latest
    restart: unless-stopped
    working_dir: /app/apps/web
    command: ["bun", "run", ".output/server/index.mjs"]
    ports:
      - "${WEB_PORT:-3011}:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - DATABASE_URL=/data/night-watch.db
      - MONITORS_CONFIG_PATH=/config/monitors.json
      - LOG_LEVEL=info
    volumes:
      - db-data:/data
      - ./config:/config:ro
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3011/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build: .
    image: night-watch:latest
    restart: unless-stopped
    working_dir: /app/apps/worker
    command: ["bun", "run", "src/index.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/data/night-watch.db
      - MONITORS_CONFIG_PATH=/config/monitors.json
      - WA_AUTH_DIR=/data/auth_wa
      - LOG_LEVEL=info
    # Baileys prints its first-run QR to stdout — allocate a TTY so
    # `docker compose logs -f worker` shows the pairing code clearly.
    tty: true
    volumes:
      - db-data:/data
      - ./config:/config:ro
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
    driver: local
